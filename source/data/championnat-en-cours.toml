# Championnat en cours : source unique de la page /resultats/en-cours/
#
# - `rencontres` : uniquement les rencontres de Pexiora. Le score s'écrit
#   "domicile-extérieur" (ex: "4-10"). Sans score, la rencontre est « à venir ».
#   statut possible : "reporte", "forfait_dom", "forfait_ext".
# - `classement` : V/N/D(/F) des autres clubs, recopiés depuis la FFTT.
#   Les lignes Pexiora ne contiennent que le nom : tout est calculé depuis
#   les rencontres. L'ordre est libre, le tri se fait sur les points ;
#   en cas d'égalité, l'ordre du fichier sert de départage.

saison = "2026-2027"
phase = 1

# Écart (en points) avec la zone de relégation en dessous duquel on alerte
seuil_alerte = 2

# Barème FFTT des points par rencontre
[points]
v = 3
n = 2
d = 1
f = 0

[[journees]]
numero = 1
dates = "19 & 20 Septembre 2026"

[[journees]]
